              schema: { $ref: '#/components/schemas/UmbralRiesgo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }

  /configuraciones:
    get:
      tags: [Administrador]
      summary: Consultar configuraciones generales del sistema (CU-19)
      x-permission: gestionar_configuracion
      responses:
        '200':
          description: Lista de configuraciones clave-valor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Configuracion' }
              example:
                - { clave: escala_calificacion, valor: "10", tipo_dato: entero, descripcion: "Escala activa: 10 o 100" }
                - { clave: zona_horaria, valor: "America/Mexico_City", tipo_dato: texto, descripcion: "Para interpretar capturada_en y agrupar sesiones por día" }
                - { clave: retardos_equivalen_falta, valor: "0", tipo_dato: entero, descripcion: "Cuántos retardos cuentan como una falta en el semáforo; 0 = no cuentan" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    put:
      tags: [Administrador]
      summary: Actualizar una configuración
      x-permission: gestionar_configuracion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clave, valor]
              properties:
                clave: { type: string }
                valor: { type: string }
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuracion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }

  /importaciones:
    post:
      tags: [Administrador]
      summary: Subir archivo de ingesta masiva (CU-14)
      x-permission: importar_datos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipo]
              properties:
                archivo:
                  type: string
                  format: binary
                tipo:
                  type: string
                  enum: [alumnos, calificaciones, docentes, catalogos]
                periodo_id:
                  type: integer
      responses:
        '202':
          description: Archivo recibido y en proceso
          content:
            application/json:
              schema:
                type: object
                properties:
                  importacion_id: { type: integer }
                  estado: { type: string, example: procesando }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }

  /importaciones/{importacion_id}:
    get:
      tags: [Administrador]
      summary: Consultar el estado y resultado de una importación
      x-permission: importar_datos
      parameters:
        - name: importacion_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Estado de la importación
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [procesando, completado, con_errores, fallido] }
                  filas_procesadas: { type: integer }
                  filas_error: { type: integer }
                  errores:
                    type: array
                    items:
                      type: object
                      properties:
                        fila: { type: integer }
                        columna: { type: string, nullable: true }
                        mensaje: { type: string }
              examples:
                procesando:
                  value: { estado: procesando, filas_procesadas: 120, filas_error: 0, errores: [] }
                completado:
                  value: { estado: completado, filas_procesadas: 450, filas_error: 0, errores: [] }
                con_errores:
                  value:
                    estado: con_errores
                    filas_procesadas: 448
                    filas_error: 2
                    errores:
                      - { fila: 17, columna: matricula, mensaje: "La matrícula 2607103500001 no tiene 14 dígitos." }
                      - { fila: 203, columna: grupo, mensaje: "El grupo 4Z no existe en el periodo 2026 B." }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # SISTEMA
  # NOTA: no se expone ningún endpoint para dispositivos_padres, por decisión
  # (2026-09-18): no hay push a padres en esta fase; las notificaciones a
  # padres/tutores salen por SMS o correo según canal_preferido. La tabla
  # queda creada en las migraciones sin uso. Si en la fase 2 se retoma el
  # push a padres, la vía prevista es un link firmado de un solo uso enviado
  # por SMS/WhatsApp — nunca un endpoint público sin autenticación, que
  # permitiría a cualquiera registrarse como tutor de un alumno.
  /dispositivos:
    post:
      tags: [Sistema]
      summary: Registrar el token FCM del dispositivo del usuario autenticado, para notificaciones push (CU-20)
      x-permission: autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_fcm, plataforma]
              properties:
                token_fcm: { type: string }
                plataforma: { type: string, enum: [android, ios, web] }
      responses:
        '201':
          description: Dispositivo registrado (o reactivado si el token ya existía)
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }

  /sistema/alertas/ejecutar:
    post:
      tags: [Sistema]
      summary: >
        Disparar manualmente la detección de riesgo y generación de
        alertas (CU-12; normalmente corre programado vía scheduler)
      x-permission: ejecutar_alertas
      responses:
        '200':
          description: Alertas generadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  alertas_generadas: { type: integer }
              example: { alertas_generadas: 6 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  parameters:
    GrupoId:
      name: grupo_id
      in: path
      required: true
      schema: { type: integer }
    AlumnoId:
      name: alumno_id
      in: path
      required: true
      schema: { type: integer }
    UsuarioId:
      name: usuario_id
      in: path
      required: true
      schema: { type: integer }
    PadreTutorId:
      name: padre_tutor_id
      in: path
      required: true
      schema: { type: integer }

  responses:
    NoAutenticado:
      description: Falta el token Bearer, es inválido o fue revocado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: "No autenticado."
    SinPermiso:
      description: >
        El usuario está autenticado pero su rol no tiene el permiso de la
        operación (x-permission), o el recurso no le pertenece (middlewares
        de pertenencia, s5a-s7a)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: "No tienes permiso para realizar esta acción."
    NoEncontrado:
      description: El recurso indicado en la ruta no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: "Recurso no encontrado."
    Conflicto:
      description: La operación choca con un registro existente (llave única)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: "El registro ya existe."
    ErrorValidacion:
      description: El body no pasó la validación (forma estándar de Laravel)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorValidacion' }
          example:
            message: "Los datos enviados no son válidos. (y 1 error más)"
            errors:
              "listas.0.registros.0.uuid_local": ["El campo uuid_local es obligatorio."]
              "listas.0.registros.0.capturada_en": ["El campo capturada_en es obligatorio."]

  examples:
    SesionDocente:
      value:
        id: 4
        nombre: "Juan Carlos Méndez Ruiz"
        username: docente1
        correo: "docente1@cobach35.test"
        rol: docente
        activo: true
        es_super_admin: false
        permisos: [registrar_asistencia, consultar_asistencias, consultar_calificaciones]
    SesionOrientador:
      value:
        id: 2
        nombre: "María Elena Cruz Gómez"
        username: orientador1
        correo: "orientador1@cobach35.test"
        rol: orientador
        activo: true
        es_super_admin: false
        permisos: [consultar_asistencias, consultar_calificaciones, consultar_alumnos, ver_semaforo_riesgo, registrar_observacion, notificar_tutor, autorizar_justificacion, generar_reportes]
    SesionAdministrador:
      value:
        id: 1
        nombre: "Administrador del sistema"
        username: admin
        correo: "admin@cobach35.test"
        rol: administrador
        activo: true
        es_super_admin: false
        permisos: [gestionar_usuarios, gestionar_catalogos, gestionar_configuracion, registrar_asistencia, consultar_asistencias, autorizar_justificacion, ver_semaforo_riesgo, registrar_observacion, notificar_tutor, generar_reportes, consultar_alumnos, consultar_calificaciones, editar_calificaciones, importar_datos, ejecutar_alertas]

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ErrorValidacion:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          description: Un arreglo de mensajes por cada campo que falló
          additionalProperties:
            type: array
            items: { type: string }

    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        username: { type: string }
        correo: { type: string, nullable: true }
        rol:
          type: string
          description: >
            Nombre del rol (hoy docente, orientador o administrador). Es string
            libre, no enum: el RBAC admite roles nuevos sin cambiar el contrato.
          example: docente
        activo: { type: boolean }

    UsuarioSesion:
      description: >
        Lo que devuelven /login y /me. Incluye la lista de permisos efectivos:
        los clientes deciden qué pantallas y acciones mostrar según permisos,
        no según el nombre del rol.
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            es_super_admin: { type: boolean }
            permisos:
              type: array
              items: { type: string }
              example: [registrar_asistencia, consultar_asistencias, consultar_calificaciones]

    UsuarioInput:
      type: object
      required: [nombre, username, password, rol_id]
      properties:
        nombre: { type: string }
        username: { type: string }
        password: { type: string, format: password }
        correo: { type: string, format: email }
        rol_id: { type: integer }
        numero_empleado:
          type: string
          description: Solo aplica si el rol asignado es docente

    Plantel:
      type: object
      properties:
        id: { type: integer }
        clave: { type: string, example: "07ECB0043I" }
        nombre: { type: string }

    Grado:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string, example: "1" }

    Materia:
      type: object
      properties:
        id: { type: integer }
        clave: { type: string, example: "A0021" }
        nombre: { type: string }
        tipo_evaluacion: { type: string, enum: [numerica, alfanumerica] }

    PeriodoEscolar:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string, example: "2026 B" }
        fecha_inicio: { type: string, format: date, nullable: true }
        fecha_fin: { type: string, format: date, nullable: true }
        estado: { type: string, enum: [activo, cerrado] }

    Configuracion:
      type: object
      properties:
        clave: { type: string }
        valor: { type: string }
        tipo_dato: { type: string, enum: [entero, decimal, texto, booleano] }
        descripcion: { type: string, nullable: true }

    Horario:
      type: object
      description: Combinación grupo + materia + horario asignada a un docente
      properties:
        id: { type: integer }
        grupo: { $ref: '#/components/schemas/Grupo' }
        materia:
          type: object
          properties:
            id: { type: integer }
            clave: { type: string }
            nombre: { type: string }
        dia_semana: { type: integer, minimum: 1, maximum: 7, description: "1=lunes ... 7=domingo" }
        hora_inicio: { type: string, example: "07:00" }
        hora_fin: { type: string, example: "07:50" }

    Grupo:
      type: object
      properties:
        id: { type: integer }
        grado: { type: string, example: "1" }
        letra: { type: string, example: "A" }
        turno: { type: string, enum: [matutino, vespertino] }
        plantel_id: { type: integer }
        periodo_id: { type: integer }

    GrupoInput:
      type: object
      required: [grado_id, plantel_id, periodo_id, letra, turno]
      properties:
        grado_id: { type: integer }
        plantel_id: { type: integer }
        periodo_id: { type: integer }
        letra: { type: string, example: "A", maxLength: 1 }
        turno: { type: string, enum: [matutino, vespertino] }

    Alumno:
      type: object
      description: >
        No incluye grupo_id: el grupo se obtiene vía la inscripción
        vigente del alumno, no es un campo propio de esta tabla.
      properties:
        id: { type: integer }
        matricula: { type: string }
        nombre: { type: string }
        activo: { type: boolean, description: "false = baja/deserción" }
        situacion_academica:
          type: string
          enum: [regular, irregular, recursador, extemporaneo]
          description: Proviene de la inscripción vigente del alumno

    SesionClase:
      type: object
      properties:
        id: { type: integer }
        horario_id: { type: integer }
        fecha: { type: string, format: date }
        cancelada: { type: boolean }

    AsistenciaOnlineInput:
      type: object
      description: >
        Para POST /asistencias y /asistencias/lote. No se pide origen ni
        capturada_en — el servidor los fija ('online' y now()).
      required: [alumno_id, estado]
      properties:
        alumno_id: { type: integer }
        estado:
          type: string
          enum: [presente, ausente, retardo, justificado]

    AsistenciaOfflineRegistro:
      type: object
      description: Para POST /asistencias/sincronizar, dentro de cada lista (ver ese endpoint).
      required: [uuid_local, alumno_id, estado, capturada_en]
      properties:
        uuid_local:
          type: string
          format: uuid
          description: UUID generado en el dispositivo — identidad idempotente del registro
        alumno_id: { type: integer }
        estado:
          type: string
          enum: [presente, ausente, retardo, justificado]
        capturada_en:
          type: string
          format: date-time
          description: Momento real en que se pasó lista en el aula (hora local del dispositivo, con offset)

    Asistencia:
      type: object
      properties:
        id: { type: integer }
        sesion_clase_id: { type: integer }
        alumno_id: { type: integer }
        estado:
          type: string
          enum: [presente, ausente, retardo, justificado]
        uuid_local: { type: string, nullable: true }
        origen: { type: string, enum: [online, offline] }
        capturada_en: { type: string, format: date-time }
        registrado_por: { type: integer, description: "usuario_id de quien registró (se llena server-side)" }
        sincronizada_en: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Observacion:
      type: object
      properties:
        id: { type: integer }
        alumno_id: { type: integer }
        orientador_id: { type: integer }
        fecha: { type: string, format: date }
        texto: { type: string }

    Notificacion:
      type: object
      properties:
        id: { type: integer }
        alumno_id: { type: integer }
        padre_tutor_id: { type: integer }
        tipo: { type: string, enum: [automatica, manual] }
        canal:
          type: string
          enum: [sms, email]
          description: "'push' queda reservado para la fase 2 (push a padres); en esta fase no se usa"
        estado: { type: string, enum: [pendiente, enviada, fallida] }
        mensaje: { type: string }
        fecha_envio: { type: string, format: date-time, nullable: true }
        error_detalle: { type: string, nullable: true }

    Calificacion:
      type: object
      properties:
        id: { type: integer }
        alumno_id: { type: integer }
        materia_id: { type: integer }
        periodo_id: { type: integer }
        parcial: { type: integer, enum: [1, 2, 3] }
        calificacion: { type: string, description: "Numérica (según escala_calificacion) o A/NA según materias.tipo_evaluacion" }
        tipo: { type: string, enum: [regular, cursadora] }
        origen: { type: string, enum: [importado, manual] }

    Rol:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        permisos:
          type: array
          items: { $ref: '#/components/schemas/Permiso' }

    Permiso:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string, example: registrar_asistencia }
        descripcion: { type: string }

    PadreTutor:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        telefono: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        canal_preferido:
          type: string
          enum: [sms, email]
          description: "'push' queda reservado para la fase 2; la API lo rechaza en esta fase"

    PadreTutorInput:
      type: object
      required: [nombre]
      description: >
        Debe traer telefono si canal_preferido=sms, o correo si
        canal_preferido=email (validación de backend).
      properties:
        nombre: { type: string }
        telefono: { type: string }
        correo: { type: string, format: email }
        canal_preferido: { type: string, enum: [sms, email], default: sms }

    UmbralRiesgo:
      type: object
      properties:
        id: { type: integer }
        periodo_id: { type: integer, nullable: true, description: "null = umbral global por defecto" }
        nivel: { type: string, enum: [bajo, medio, alto] }
        porcentaje_min: { type: number, format: float }
        porcentaje_max: { type: number, format: float }
        faltas_consecutivas: { type: integer, nullable: true }
        color_hex: { type: string, example: "#16a34a" }
