      responses:
        '200':
          description: Lista de observaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Observacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /notificaciones:
    get:
