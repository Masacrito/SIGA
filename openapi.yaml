          schema: { type: string, enum: [pendiente, enviada, fallida] }
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Orientador]
      summary: Enviar manualmente una notificación al tutor principal de un alumno (CU-09)
      x-permission: notificar_tutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alumno_id, mensaje]
              properties:
                alumno_id: { type: integer }
                mensaje: { type: string, maxLength: 500 }
      responses:
        '201':
          description: >
