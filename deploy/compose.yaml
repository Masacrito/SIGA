# SIGA — despliegue completo (API Laravel + web Vue + MySQL) en un solo servidor.
# Se levanta con deploy.sh; las variables salen de deploy/.env (lo genera el script).
name: siga

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Mexico_City
    # Ajustado para una instancia de 2 GB
    command: --innodb-buffer-pool-size=256M --performance-schema=OFF --max-connections=60
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Sin "ports": MySQL no se publica fuera del servidor

  app:
    build:
      context: ../asistencias_back
      args:
        COMPOSER_DEV: ${DEMO:-0}
    image: siga-app
    restart: unless-stopped
    environment: &laravel_env
      APP_NAME: SIGA
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: America/Mexico_City
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: es_MX
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      SANCTUM_WEB_TOKEN_MINUTOS: "480"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../asistencias_front
      args:
        VITE_API_URL: /api
    image: siga-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Cola de trabajos de Laravel. Apagada por ahora (todavía no hay jobs);
  # cuando entren las alertas a tutores: docker compose --profile worker up -d
  worker:
    image: siga-app
    profiles: [worker]
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment: *laravel_env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:
